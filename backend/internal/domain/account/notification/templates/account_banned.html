<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
</head>
<body style="margin:0;padding:0;background:#f6f7f9;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
    <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:28px;">
      <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">您好{{if .Username}}，{{.Username}}{{end}}：</p>
      <p style="margin:0 0 20px;font-size:16px;line-height:1.7;">由于您的账号违反了 SJTU选课社区 的相关规定，账号已被封禁。</p>

      <table role="presentation" style="width:100%;margin:0 0 20px;border-collapse:collapse;border-spacing:0;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;">
        {{if .Reason}}
        <tr>
          <td style="width:120px;padding:12px 14px;border-bottom:1px solid #e5e7eb;color:#6b7280;font-size:14px;vertical-align:top;">封禁原因</td>
          <td style="padding:12px 14px;border-bottom:1px solid #e5e7eb;color:#111827;font-size:14px;line-height:1.6;">{{.Reason}}</td>
        </tr>
        {{end}}
        <tr>
          <td style="width:120px;padding:12px 14px;color:#6b7280;font-size:14px;vertical-align:top;">封禁期限</td>
          <td style="padding:12px 14px;color:#111827;font-size:14px;line-height:1.6;">{{if .BannedUntil}}{{.BannedUntil}} 截止{{else}}永久{{end}}</td>
        </tr>
      </table>

      <p style="margin:0;font-size:14px;line-height:1.7;color:#4b5563;">封禁期间您将无法使用 SJTU选课社区。如有疑问，请发送邮件至 course@sjtu.plus。</p>
    </div>
    <p style="margin:16px 0 0;text-align:center;font-size:12px;color:#9ca3af;">SJTU选课社区</p>
  </div>
</body>
</html>
