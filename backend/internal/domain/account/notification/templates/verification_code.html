    <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:28px;">

      <div style="margin:0 0 20px;padding:18px 20px;background:#f3f4f6;border-radius:6px;text-align:center;">
        <div style="font-size:30px;font-weight:700;letter-spacing:4px;color:#111827;">{{.Code}}</div>
        <div style="margin-top:8px;font-size:14px;color:#6b7280;">{{.ExpiresIn}}内有效</div>

    </div>

  </div>
